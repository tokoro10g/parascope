allowBuilds:
  core-js: false
  core-js-pure: false
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy Babel dependency published without provenance after semver 7.x.
  - semver@6.3.1
  # Docusaurus dependency; 1.6.1 lacks the provenance present in 1.6.0.
  - detect-port@1.6.1
blockExoticSubdeps: true
strictDepBuilds: true
overrides:
  '@babel/core@<=7.29.0': ^7.29.6
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': ^7.29.4
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  body-parser@<1.20.9: ^1.20.9
  brace-expansion@<1.1.21: ^1.1.21
  browserslist@<=4.28.6: ^4.28.7
  colord@<2.9.4: ^2.9.4
  compression@<1.8.2: ^1.8.2
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  follow-redirects@<=1.15.11: ^1.16.0
  http-cache-semantics@<=4.2.0: ^4.3.0
  http-proxy-middleware@>=0.16.0 <2.0.10: ^2.0.10
  image-size@>=0.6.3 <=2.0.2: ^2.0.3
  joi@<17.13.8: ^17.13.8
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  launch-editor@<=2.14.1: ^2.14.2
  nanoid@<3.3.18: ^3.3.18
  postcss-selector-parser@<7.1.6: ^7.1.6
  postcss@<=8.5.22: ^8.5.23
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  qs@>=2.2.5 <6.16.0: ^6.16.0
  serialize-javascript@<7.1.3: ^7.1.3
  shell-quote@<=1.8.4: ^1.9.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  svgo@>=3.0.0 <3.3.5: ^3.3.5
  tinypool@<2.1.2: ^2.1.2
  uuid@<11.1.1: ^11.1.1
  webpack-dev-server@<=5.2.5: ^5.2.6
  websocket-driver@<0.7.5: ^0.7.5
  ws@>=7.0.0 <7.5.11: ^7.5.11
  ws@>=8.0.0 <8.21.0: ^8.21.0
