name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            packages/parascope-runtime/uv.lock

      - name: Ruff Check (Backend)
        run: uv run --locked ruff check .
        working-directory: backend

      - name: Ruff Format Check (Backend)
        run: uv run --locked ruff format --check .
        working-directory: backend

      - name: Ruff Check (Runtime)
        run: uv run --locked ruff check .
        working-directory: packages/parascope-runtime

      - name: Ruff Format Check (Runtime)
        run: uv run --locked ruff format --check .
        working-directory: packages/parascope-runtime

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: frontend/package.json

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Frontend Lint
        run: pnpm lint
        working-directory: frontend

      - name: Frontend Build
        run: pnpm build
        working-directory: frontend

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5.0.0
        with:
          package_json_file: docs/package.json

      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Build documentation
        run: pnpm build
        working-directory: docs

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Build backend image
        run: docker build -t parascope-backend:ci . -f backend/Dockerfile.prod

      - name: Build frontend image
        run: docker build -t parascope-frontend:ci ./frontend -f ./frontend/Dockerfile.prod

      - name: Save images as artifacts
        run: |
          docker save parascope-backend:ci | gzip > backend-image.tar.gz
          docker save parascope-frontend:ci | gzip > frontend-image.tar.gz

      - name: Upload backend image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1

      - name: Upload frontend image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-image
          path: frontend-image.tar.gz
          retention-days: 1

  backend-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Download backend image
        uses: actions/download-artifact@v8.0.2
        with:
          name: backend-image

      - name: Load backend image
        run: |
          docker load < backend-image.tar.gz
          docker tag parascope-backend:ci parascope-test-backend-test

      - name: Run Backend Tests
        run: |
          docker compose -f docker-compose.test.yml up --no-build --abort-on-container-exit --exit-code-from backend-test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_key' }}

  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Download images
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-image'
          merge-multiple: true

      - name: Load images
        run: |
          docker load < backend-image.tar.gz
          docker load < frontend-image.tar.gz
          docker tag parascope-backend:ci parascope-e2e-backend
          docker tag parascope-frontend:ci parascope-e2e-frontend

      - name: Run E2E Tests
        run: |
          docker compose -f docker-compose.e2e.yml up --no-build --abort-on-container-exit --exit-code-from e2e-runner

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30
